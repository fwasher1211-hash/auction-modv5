
name: Build Auction Mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build mod
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

            - name: Compile mod
        working-directory: fartiqs-auction-mod
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: auction-mod-jar
          path: build/libs/*.jar
